<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript to Notion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .form-section {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #ff4444; }
        input[type="text"]::placeholder { color: #555; }

        .mode-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .mode-btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            background: #1a1a1a;
            color: #888;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #ff4444;
            color: #fff;
        }
        .mode-btn:hover:not(.active) { color: #ccc; }

        .paste-section {
            display: none;
            margin-bottom: 24px;
        }
        .paste-section.active { display: block; }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #ff4444; }
        textarea::placeholder { color: #555; }

        .paste-help {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #666;
        }
        .paste-help a { color: #ff6666; text-decoration: none; }
        .paste-help a:hover { text-decoration: underline; }

        button.submit-btn {
            width: 100%;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 24px;
        }
        button.submit-btn:hover { background: #e03333; }
        button.submit-btn:disabled { background: #555; cursor: not-allowed; }

        .status {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .status.active { display: block; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #333;
            border-top-color: #ff4444;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .results { display: none; }
        .results.active { display: block; }

        .notion-link {
            display: inline-block;
            margin-bottom: 24px;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ff4444;
            text-decoration: none;
            font-weight: 600;
            transition: border-color 0.2s;
        }
        .notion-link:hover { border-color: #ff4444; }

        .transcript-section {
            margin-bottom: 24px;
        }
        .transcript-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-original { background: #333; color: #aaa; }
        .badge-optimized { background: #2a1a1a; color: #ff6666; }

        .transcript-box {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .transcript-box::-webkit-scrollbar { width: 6px; }
        .transcript-box::-webkit-scrollbar-track { background: transparent; }
        .transcript-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .error {
            background: #2a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 16px;
            color: #ff6666;
            display: none;
            margin-bottom: 24px;
        }
        .error.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Transcript to Notion</h1>
        <p class="subtitle">Extract or paste a transcript, optimize it with AI, and save to Notion.</p>

        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('paste')" id="modePaste">Paste Transcript</button>
            <button class="mode-btn" onclick="setMode('auto')" id="modeAuto">Auto-Extract</button>
        </div>

        <div class="form-section">
            <label>YouTube URL</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
        </div>

        <div class="paste-section active" id="pasteSection">
            <label>Paste Transcript</label>
            <textarea id="transcriptInput" placeholder="Paste the transcript from ElevenLabs here..."></textarea>
            <p class="paste-help">
                Get the transcript from
                <a href="https://elevenlabs.io/youtube-transcript-generator" target="_blank">ElevenLabs YouTube Transcript Generator</a>,
                then paste it above.
            </p>
        </div>

        <div class="error" id="errorBox"></div>

        <button class="submit-btn" id="processBtn" onclick="processVideo()">Optimize & Save to Notion</button>

        <div class="status" id="statusBox">
            <span class="spinner"></span>
            <span id="statusText">Processing...</span>
        </div>

        <div class="results" id="resultsBox">
            <a class="notion-link" id="notionLink" href="#" target="_blank">
                Open in Notion &rarr;
            </a>

            <div class="transcript-section">
                <h2>Original Transcript <span class="badge badge-original">Raw</span></h2>
                <div class="transcript-box" id="originalText"></div>
            </div>

            <div class="transcript-section">
                <h2>Optimized Transcript <span class="badge badge-optimized">AI Enhanced</span></h2>
                <div class="transcript-box" id="optimizedText"></div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = "paste";

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("modePaste").classList.toggle("active", mode === "paste");
            document.getElementById("modeAuto").classList.toggle("active", mode === "auto");
            document.getElementById("pasteSection").classList.toggle("active", mode === "paste");
        }

        async function processVideo() {
            const url = document.getElementById("urlInput").value.trim();
            const pasted = document.getElementById("transcriptInput").value.trim();

            if (!url) {
                showError("Please enter a YouTube URL.");
                return;
            }
            if (currentMode === "paste" && !pasted) {
                showError("Please paste the transcript.");
                return;
            }

            const btn = document.getElementById("processBtn");
            const status = document.getElementById("statusBox");
            const statusText = document.getElementById("statusText");
            const results = document.getElementById("resultsBox");

            btn.disabled = true;
            hideError();
            results.classList.remove("active");
            status.classList.add("active");

            if (currentMode === "paste") {
                statusText.textContent = "Optimizing transcript and saving to Notion... This may take a minute.";
            } else {
                statusText.textContent = "Extracting transcript, optimizing with AI, and saving to Notion... This may take a minute.";
            }

            try {
                const formData = new FormData();
                formData.append("youtube_url", url);
                if (currentMode === "paste") {
                    formData.append("pasted_transcript", pasted);
                }

                const response = await fetch("/process", {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                document.getElementById("originalText").textContent = data.original;
                document.getElementById("optimizedText").textContent = data.optimized;
                document.getElementById("notionLink").href = data.notion_url;

                status.classList.remove("active");
                results.classList.add("active");
            } catch (err) {
                status.classList.remove("active");
                showError(err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function showError(msg) {
            const box = document.getElementById("errorBox");
            box.textContent = msg;
            box.classList.add("active");
        }

        function hideError() {
            document.getElementById("errorBox").classList.remove("active");
        }

        document.getElementById("urlInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") processVideo();
        });
    </script>
</body>
</html>
