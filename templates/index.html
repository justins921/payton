<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript to Notion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #ff4444; }
        input[type="text"]::placeholder { color: #555; }
        button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #e03333; }
        button:disabled { background: #555; cursor: not-allowed; }

        .status {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .status.active { display: block; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #333;
            border-top-color: #ff4444;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .results { display: none; }
        .results.active { display: block; }

        .notion-link {
            display: inline-block;
            margin-bottom: 24px;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ff4444;
            text-decoration: none;
            font-weight: 600;
            transition: border-color 0.2s;
        }
        .notion-link:hover { border-color: #ff4444; }

        .transcript-section {
            margin-bottom: 24px;
        }
        .transcript-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-original { background: #333; color: #aaa; }
        .badge-optimized { background: #2a1a1a; color: #ff6666; }

        .transcript-box {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .transcript-box::-webkit-scrollbar { width: 6px; }
        .transcript-box::-webkit-scrollbar-track { background: transparent; }
        .transcript-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .error {
            background: #2a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 16px;
            color: #ff6666;
            display: none;
            margin-bottom: 24px;
        }
        .error.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Transcript to Notion</h1>
        <p class="subtitle">Paste a YouTube URL to extract, optimize, and save the transcript to Notion.</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
            <button id="processBtn" onclick="processVideo()">Process</button>
        </div>

        <div class="error" id="errorBox"></div>

        <div class="status" id="statusBox">
            <span class="spinner"></span>
            <span id="statusText">Extracting transcript...</span>
        </div>

        <div class="results" id="resultsBox">
            <a class="notion-link" id="notionLink" href="#" target="_blank">
                Open in Notion &rarr;
            </a>

            <div class="transcript-section">
                <h2>Original Transcript <span class="badge badge-original">Raw</span></h2>
                <div class="transcript-box" id="originalText"></div>
            </div>

            <div class="transcript-section">
                <h2>Optimized Transcript <span class="badge badge-optimized">AI Enhanced</span></h2>
                <div class="transcript-box" id="optimizedText"></div>
            </div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const url = document.getElementById("urlInput").value.trim();
            if (!url) return;

            const btn = document.getElementById("processBtn");
            const status = document.getElementById("statusBox");
            const statusText = document.getElementById("statusText");
            const results = document.getElementById("resultsBox");
            const errorBox = document.getElementById("errorBox");

            btn.disabled = true;
            errorBox.classList.remove("active");
            results.classList.remove("active");
            status.classList.add("active");
            statusText.textContent = "Extracting transcript, optimizing with AI, and saving to Notion... This may take a minute.";

            try {
                const formData = new FormData();
                formData.append("youtube_url", url);

                const response = await fetch("/process", {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                document.getElementById("originalText").textContent = data.original;
                document.getElementById("optimizedText").textContent = data.optimized;
                document.getElementById("notionLink").href = data.notion_url;

                status.classList.remove("active");
                results.classList.add("active");
            } catch (err) {
                status.classList.remove("active");
                errorBox.textContent = err.message;
                errorBox.classList.add("active");
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById("urlInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") processVideo();
        });
    </script>
</body>
</html>
