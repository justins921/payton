services:
  - type: web
    name: youtube-transcript-notion
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_PAGE_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
